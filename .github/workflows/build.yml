name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # 1. ON CRÉE UN NOUVEAU PROJET TEMPORAIRE
      - name: Create Flutter project
        run: |
          cd ..
          flutter create --platforms=android --project-name=ram_wallet temp_project
          cd temp_project
          flutter pub get
          cd ../ram_wallet

      # 2. ON COPIE NOTRE CODE DANS LE PROJET
      - name: Copy our code to the new project
        run: |
          # On copie notre pubspec.yaml
          cp pubspec.yaml ../temp_project/
          # On copie nos fichiers Dart
          cp -r lib/* ../temp_project/lib/
          # On copie les assets
          cp -r assets ../temp_project/ 2>/dev/null || true
          # On copie les autres fichiers
          cp analysis_options.yaml ../temp_project/ 2>/dev/null || true

      # 3. ON SE DÉPLACE DANS LE PROJET TEMPORAIRE
      - name: Move to temp project
        run: |
          cd ../temp_project
          ls -la lib/

      # 4. ON RÉCUPÈRE LES DÉPENDANCES
      - name: Get dependencies
        run: |
          cd ../temp_project
          flutter pub get

      # 5. ON CONSTRUIT L'APK
      - name: Build APK
        run: |
          cd ../temp_project
          flutter build apk --release

      # 6. ON RÉCUPÈRE L'APK
      - name: Copy APK to original folder
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          cp ../temp_project/build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ram-wallet-app
          path: build/app/outputs/flutter-apk/app-release.apk
