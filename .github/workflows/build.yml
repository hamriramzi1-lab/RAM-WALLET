name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      # ÉTAPE IMPORTANTE : Créer la structure Android
      - name: Create Android project structure
        run: |
          flutter create --platforms=android --project-name=ram_wallet .
          # On garde nos fichiers Dart et on supprime ceux créés par défaut
          rm -rf lib/main.dart
          # On recrée la structure de dossiers
          mkdir -p lib/models lib/screens lib/services lib/widgets

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ram-wallet-app
          path: build/app/outputs/flutter-apk/app-release.apk
