name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Android project structure
        run: |
          # On crée un projet propre
          flutter create --platforms=android --project-name=ram_wallet android_project
          # On copie notre code
          cp -r lib/* android_project/lib/
          cp pubspec.yaml android_project/
          cp -r assets android_project/ 2>/dev/null || true
          # On se déplace dans le projet
          cd android_project

      - name: Get dependencies
        run: |
          cd android_project
          flutter pub get

      - name: Build APK
        run: |
          cd android_project
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ram-wallet-app
          path: android_project/build/app/outputs/flutter-apk/app-release.apk
