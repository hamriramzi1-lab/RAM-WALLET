name: ram_wallet
description: Application personnelle de gestion financière - Salaires, dépenses, dettes et statistiques
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # ============================================
  # 📦 STOCKAGE LOCAL (Base de données)
  # ============================================
  
  # Stockage local simple (pour les préférences utilisateur)
  shared_preferences: ^2.2.3
  
  # Base de données NoSQL locale (alternative plus robuste)
  hive_flutter: ^1.1.0
  
  # Pour la sérialisation des données avec Hive
  hive: ^2.2.3
  
  # ============================================
  # 📅 CALENDRIER & DATES
  # ============================================
  
  # Sélecteur de calendrier (pour les dates personnalisées)
  table_calendar: ^3.1.2
  
  # Formatage avancé des dates
  intl: ^0.19.0
  
  # ============================================
  # 📊 GRAPHIQUES & STATISTIQUES
  # ============================================
  
  # Graphiques camembert, barres, etc. (pour les stats)
  fl_chart: ^0.68.0
  
  # ============================================
  # 🎨 UI & ANIMATIONS
  # ============================================
  
  # Icônes supplémentaires (pour les catégories)
  cupertino_icons: ^1.0.8
  
  # Animations d'apparition des widgets
  flutter_staggered_animations: ^1.1.1
  
  # Pour les effets de flou et glassmorphism
  flutter_animate: ^4.5.0
  
  # ============================================
  # 🔧 UTILITAIRES
  # ============================================
  
  # Génération d'ID uniques (pour les transactions)
  uuid: ^4.3.3
  
  # Gestion des logs
  logger: ^2.2.0
  
  # Formatage des nombres (pour les montants)
  intl_phone_number_input: ^0.7.2
  
  # ============================================
  # 📱 FONCTIONNALITÉS SPÉCIFIQUES
  # ============================================
  
  # Pour les notifications (rappel de paiement)
  flutter_local_notifications: ^17.0.1
  
  # Export de données en CSV
  csv: ^6.0.0
  
  # Partage de fichiers (export)
  share_plus: ^9.0.0
  
  # ============================================
  # 🔐 SÉCURITÉ (Optionnel mais recommandé)
  # ============================================
  
  # Stockage sécurisé des données sensibles
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Règles de qualité Flutter
  flutter_lints: ^4.0.0
  
  # Build runner pour Hive
  build_runner: ^2.4.9
  
  # Générateur de code pour Hive
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # ============================================
  # 🖼️ ASSETS (Images, icônes, etc.)
  # ============================================
  
  assets:
    # Icônes des catégories
    - assets/icons/categories/
    # Images de fond
    - assets/images/
    # Données par défaut
    - assets/data/

  # ============================================
  # 🔤 POLICES PERSONNALISÉES
  # ============================================
  
  fonts:
    # Police principale pour les montants
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
